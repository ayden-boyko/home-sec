[project]
name = "home-sec-controller"
version = "0.1.0"
description = "Web server and controller for home security system"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "requests>=2.31",
    "numpy>=1.26",
    "opencv-python>=4.9 ; platform_machine != \"aarch64\"",
    "opencv-python-headless>=4.9 ; platform_machine == \"aarch64\"",
]

[tool.uv]
package = false