<!doctype html>
<html>
  <head>
    <title>Security Camera Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial;
        background: #1a1a1a;
        color: #fff;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 20px;
      }

      .camera-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .camera {
        background: #222;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid #333;
      }

      .camera-header {
        background: #333;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .camera-name {
        font-weight: bold;
      }
      .status {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
      }
      .status.online {
        background: #4caf50;
      }
      .status.offline {
        background: #f44336;
      }

      video {
        width: 100%;
        height: 300px;
        background: #000;
      }

      .add-camera {
        background: #333;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      input,
      button {
        padding: 10px;
        margin-right: 10px;
        border: none;
        border-radius: 4px;
      }

      input {
        background: #444;
        color: #fff;
      }
      button {
        background: #4caf50;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #45a049;
      }

      .delete-btn {
        background: #f44336;
        padding: 5px 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Security Camera Dashboard</h1>

      <div class="add-camera">
        <h3>Add Camera</h3>
        <input type="text" id="cameraName" placeholder="Camera Name" />
        <input type="text" id="cameraIP" placeholder="Camera IP" />
        <input
          type="number"
          id="cameraPort"
          placeholder="Port (default 5000)"
          value="5000"
        />
        <button onclick="addCamera()">Add Camera</button>
      </div>

      <div class="camera-grid" id="cameraGrid"></div>
    </div>

    <script>
      const API_URL = `http://${window.location.hostname}:5001/api`;

      function setupHLS(videoElement, streamUrl) {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(videoElement);
          hls.on(Hls.Events.ERROR, function (event, data) {
            console.error("HLS error:", data);
          });
        } else if (videoElement.canPlayType("application/vnd.apple.mpegurl")) {
          videoElement.src = streamUrl;
        }
      }

      async function loadCameras() {
        try {
          const resp = await fetch(`${API_URL}/cameras`);
          const cameras = await resp.json();
          const grid = document.getElementById("cameraGrid");
          grid.innerHTML = "";

          for (const cam of cameras) {
            const div = document.createElement("div");
            div.className = "camera";
            const videoId = `video-cam${cam.id}`;
            div.innerHTML = `
                        <div class="camera-header">
                            <div>
                                <div class="camera-name">${cam.name}</div>
                                <div style="font-size: 12px; color: #aaa;">${cam.ip}:${cam.port}</div>
                            </div>
                            <div>
                                <span class="status ${cam.status}">${cam.status.toUpperCase()}</span>
                                <button class="delete-btn" onclick="deleteCamera(${cam.id})">Delete</button>
                            </div>
                        </div>
                        <video id="${videoId}" controls autoplay style="width: 100%; height: 300px; background: #000;"></video>
                    `;
            grid.appendChild(div);

            const videoEl = document.getElementById(videoId);
            setupHLS(videoEl, `/cam${cam.id}/stream.m3u8`);
          }
        } catch (err) {
          console.error("Error loading cameras:", err);
        }
      }

      async function addCamera() {
        const name = document.getElementById("cameraName").value;
        const ip = document.getElementById("cameraIP").value;
        const port =
          parseInt(document.getElementById("cameraPort").value) || 5000;

        if (!name || !ip) {
          alert("Name and IP required");
          return;
        }

        try {
          const resp = await fetch(`${API_URL}/cameras`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, ip, port }),
          });
          const result = await resp.json();
          alert(result.message);
          if (result.success) {
            document.getElementById("cameraName").value = "";
            document.getElementById("cameraIP").value = "";
            loadCameras();
          }
        } catch (err) {
          alert(`Error: ${err}`);
        }
      }

      async function deleteCamera(id) {
        if (!confirm("Delete this camera?")) return;
        try {
          await fetch(`${API_URL}/cameras/${id}`, { method: "DELETE" });
          loadCameras();
        } catch (err) {
          alert(`Error: ${err}`);
        }
      }

      loadCameras();
      setInterval(loadCameras, 30000);
    </script>
  </body>
</html>
