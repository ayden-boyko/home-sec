<!doctype html>
<html>
  <head>
    <title>Security Camera Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial;
        background: #1a1a1a;
        color: #fff;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        margin-bottom: 20px;
      }

      .camera-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      .camera {
        background: #222;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid #333;
      }

      .camera-header {
        background: #333;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .camera-name {
        font-weight: bold;
      }
      .status {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
      }
      .status.online {
        background: #4caf50;
      }
      .status.offline {
        background: #f44336;
      }

      video {
        width: 100%;
        height: 300px;
        background: #000;
      }

      .add-camera {
        background: #333;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      input,
      button {
        padding: 10px;
        margin-right: 10px;
        border: none;
        border-radius: 4px;
      }

      input {
        background: #444;
        color: #fff;
      }
      button {
        background: #4caf50;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #45a049;
      }

      .delete-btn {
        background: #f44336;
        padding: 5px 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Security Camera Dashboard</h1>

      <div class="add-camera">
        <h3>Add Camera</h3>
        <input type="text" id="cameraName" placeholder="Camera Name" />
        <input type="text" id="cameraIP" placeholder="Camera IP" />
        <input
          type="number"
          id="cameraPort"
          placeholder="Port (default 5000)"
          value="5000"
        />
        <button onclick="addCamera()">Add Camera</button>
      </div>

      <div class="camera-grid" id="cameraGrid"></div>
    </div>

    <script>
      const API_URL = `http://${window.location.hostname}:5001/api`;
      const players = new Map(); // camera id -> {card, hls, status}

      function setupHLS(video, url) {
        if (Hls.isSupported()) {
          const hls = new Hls({
            liveSyncDurationCount: 2,
            liveMaxLatencyDurationCount: 4,
            maxLiveSyncPlaybackRate: 1.5,
          });
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              setTimeout(() => hls.loadSource(url), 3000); // stream not ready yet, retry
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            } else {
              hls.destroy();
            }
          });
          return hls;
        }
        if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = url; // Safari
        }
        return null;
      }

      function createCard(cam) {
        const card = document.createElement("div");
        card.className = "camera";
        card.innerHTML = `
    <div class="camera-header">
      <div>
        <div class="camera-name"></div>
        <div class="camera-addr" style="font-size:12px;color:#aaa;"></div>
      </div>
      <div>
        <span class="status"></span>
        <button class="delete-btn">Delete</button>
      </div>
    </div>
    <video autoplay muted playsinline></video>`;
        card.querySelector(".camera-name").textContent = cam.name;
        card.querySelector(".camera-addr").textContent =
          `${cam.ip}:${cam.port}`;
        card.querySelector(".delete-btn").onclick = () => deleteCamera(cam.id);
        document.getElementById("cameraGrid").appendChild(card);
        const hls = setupHLS(
          card.querySelector("video"),
          `/hls/cam${cam.id}/stream.m3u8`,
        );
        return { card, hls, status: card.querySelector(".status") };
      }

      async function loadCameras() {
        try {
          const resp = await fetch(`${API_URL}/cameras`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const cameras = await resp.json();
          const seen = new Set();
          for (const cam of cameras) {
            seen.add(cam.id);
            let p = players.get(cam.id);
            if (!p) {
              p = createCard(cam);
              players.set(cam.id, p);
            }
            p.status.textContent = cam.status.toUpperCase();
            p.status.className = `status ${cam.status}`;
          }
          for (const [id, p] of players) {
            if (!seen.has(id)) {
              if (p.hls) p.hls.destroy();
              p.card.remove();
              players.delete(id);
            }
          }
        } catch (err) {
          console.error("Error loading cameras:", err);
        }
      }

      async function addCamera() {
        const name = document.getElementById("cameraName").value.trim();
        const ip = document.getElementById("cameraIP").value.trim();
        const port =
          parseInt(document.getElementById("cameraPort").value) || 5000;
        if (!name || !ip) {
          alert("Name and IP required");
          return;
        }
        try {
          const resp = await fetch(`${API_URL}/cameras`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, ip, port }),
          });
          if (
            !resp.ok &&
            !(resp.headers.get("content-type") || "").includes("json")
          ) {
            alert(`Server error: HTTP ${resp.status}`);
            return;
          }
          const result = await resp.json();
          alert(result.message);
          if (result.success) {
            document.getElementById("cameraName").value = "";
            document.getElementById("cameraIP").value = "";
            loadCameras();
          }
        } catch (err) {
          alert(`Error: ${err}`);
        }
      }

      async function deleteCamera(id) {
        if (!confirm("Delete this camera?")) return;
        try {
          await fetch(`${API_URL}/cameras/${id}`, { method: "DELETE" });
          loadCameras();
        } catch (err) {
          alert(`Error: ${err}`);
        }
      }

      loadCameras();
      setInterval(loadCameras, 10000);
    </script>
  </body>
</html>
