[project]
name = "home-sec"
version = "0.1.0"
description = "Home security system with camera streaming, AI agents, and MCP servers"
readme = "README.md"
authors = [{ name = "ayden boyko", email = "aydenboyko@gmail.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=1.2.11",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["cam", "controller", "agent_hub/agents/*"]
