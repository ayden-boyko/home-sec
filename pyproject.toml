[project]
name = "home-sec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ayden boyko", email = "aydenboyko@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "langchain[mcp]>=1.4.0",
    "langchain-ollama>=1.1.0",
    "numpy>=2.2.6",
    "ollama>=0.6.2",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
    "mcp>=2.2.0",
    "trycourier>=9.6.0",
]

[project.scripts]
home-sec = "home_sec:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
